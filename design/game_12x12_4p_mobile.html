<script>
  (function() {
    const stagedWall = document.getElementById('staged-wall');
    const corridorTarget = document.getElementById('corridor-target');
    const rotateBtn = document.getElementById('btn-rotate');
    const pathToggle = document.getElementById('path-toggle');

    let isHorizontal = true;
    let isCommitted = false;

    if (corridorTarget && stagedWall) {
      corridorTarget.addEventListener('click', function() {
        if (!isCommitted) {
          stagedWall.setAttribute('opacity', '1.0');
          isCommitted = true;
        } else {
          stagedWall.setAttribute('opacity', '0.45');
          isCommitted = false;
        }
      });
    }

    if (rotateBtn && stagedWall) {
      rotateBtn.addEventListener('click', function() {
        isHorizontal = !isHorizontal;
        if (isHorizontal) {
          stagedWall.setAttribute('width', '46.5');
          stagedWall.setAttribute('height', '4.5');
        } else {
          stagedWall.setAttribute('width', '4.5');
          stagedWall.setAttribute('height', '46.5');
        }
      });
    }

    if (pathToggle) {
      let pathsActive = true;
      pathToggle.addEventListener('click', function() {
        pathsActive = !pathsActive;
        pathToggle.querySelector('span:last-child').textContent = pathsActive ? 'Paths: On' : 'Paths: Off';
      });
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'r' || e.key === 'R') {
        if (rotateBtn) rotateBtn.click();
      } else if (e.key === 'p' || e.key === 'P') {
        if (pathToggle) pathToggle.click();
      }
    });
  })();
</script></main></body></html>
